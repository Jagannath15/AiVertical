# Jenkins Configuration as Code (JCasC)
# Applied automatically on startup. Edit here, restart Jenkins to re-apply.
# Docs: https://github.com/jenkinsci/configuration-as-code-plugin
#
# BEFORE FIRST RUN:
#   1. Replace YOUR_ORG/YOUR_REPO with your actual GitHub repo (e.g. acme/backend).
#   2. Set JENKINS_ADMIN_PASSWORD in .env — docker-compose will refuse to start without it.
#      No default is provided; never add one here.

jenkins:
  systemMessage: "AI Vertical CI — PR Review + Code Chatbot"
  numExecutors: 2
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

unclassified:
  location:
    # Must match the URL Jenkins is reachable at (used in GitHub status check links)
    url: "${JENKINS_URL:-http://localhost:8080}"

security:
  # Allow job-dsl scripts in JCasC without sandbox approval (safe in a controlled CI env)
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

jobs:
  - script: |
      pipelineJob('ai-vertical-pr-review') {
        description(
          'Scans PRs: secrets (Gitleaks), code (Semgrep), deps (Trivy), linters, AI review. ' +
          'Posts one combined PR comment and sets a GitHub status check.'
        )
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/Jagannath15/AiVertical.git')
                  // Separate credential ID from 'github-token': git SCM checkout
                  // needs a Username-with-password credential, but the Jenkinsfile's
                  // withCredentials([string(credentialsId: 'github-token', ...)])
                  // strictly requires Secret-text (StringCredentials) - same ID,
                  // two required types, can't both be satisfied at once.
                  credentials('github-checkout')
                }
                // Poll all branches; Jenkinsfile decides whether to act on a PR
                branches('**')
              }
            }
            scriptPath('Jenkinsfile')
            // lightweight(true) makes Jenkins fetch just the Jenkinsfile via
            // GitSCMFileSystem before deciding to build - but that path turns
            // branches('**') into a literal git refspec "refs/heads/**",
            // which jgit rejects (IllegalArgumentException: Invalid refspec).
            // ** is only valid for Jenkins' own branch-name matching, not for
            // an actual refspec. Full checkout sidesteps that lookup entirely.
            lightweight(false)
          }
        }
        triggers {
          // Poll every minute. Switch to githubPush() when a public Jenkins URL exists.
          scm('H/1 * * * *')
        }
      }
