services:
  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"    # Jenkins UI
      - "50000:50000"  # Jenkins agent inbound port
    volumes:
      # Persistent Jenkins home (jobs, build history, credentials)
      - jenkins_home:/var/jenkins_home
      # JCasC config files — mounted OUTSIDE jenkins_home to avoid WSL2 uid-mismatch
      # on Windows: named volume (uid 1000) vs host bind-mount can deny read access.
      - ./jenkins/casc:/var/jenkins_casc:ro
    environment:
      - CASC_JENKINS_CONFIG=/var/jenkins_casc
      # REQUIRED — no default. Set in .env or export before docker compose up.
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?Please set JENKINS_ADMIN_PASSWORD in .env (see .env.example)}
      # NOTE: GITHUB_TOKEN is deliberately NOT set here. If it were, every
      # `sh` step in every build (including PR code under test — npm test,
      # pytest, mvn, etc.) would inherit it from the container environment,
      # bypassing withCredentials scoping entirely. Store the PAT as a Jenkins
      # credential (see MANUAL_STEPS.md Option A) instead, and inject it only
      # where the Jenkinsfile's withCredentials block needs it.
      # Jenkins public URL — update when moving to a server with a real hostname
      - JENKINS_URL=${JENKINS_URL:-http://localhost:8080}
      # AI review (Phase 3) — non-secret config only. LLM_API_KEY is
      # deliberately NOT here, same reasoning as GITHUB_TOKEN above: it goes
      # in the Jenkinsfile's withCredentials block (credential ID llm-api-key).
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_ALLOW_CLOUD=${LLM_ALLOW_CLOUD:-false}

  # ── Qdrant (vector DB for chatbot — Phase 4) ─────────────────────────────
  # Uncomment when starting Phase 4.
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: qdrant
  #   restart: unless-stopped
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant_data:/qdrant/storage

volumes:
  jenkins_home:
